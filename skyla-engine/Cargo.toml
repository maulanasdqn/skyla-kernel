[package]
name = "skyla-engine"
description = "Skyla decode engine: packed weights, static arena and a replayed Vulkan command buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
skyla-gguf.workspace = true
skyla-ref.workspace = true
skyla-shaders.workspace = true

[features]
vulkan = []

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
skyla-vk.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
skyla-metal.workspace = true
skyla-vk.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
skyla-metal.workspace = true
