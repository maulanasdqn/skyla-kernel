[workspace]
resolver = "2"
members = [
    "skyla-engine",
    "skyla-gguf",
    "skyla-metal",
    "skyla-ref",
    "skyla-shaders",
    "skyla-vk",
]
default-members = [
    "skyla-engine",
    "skyla-gguf",
    "skyla-ref",
    "skyla-shaders",
    "skyla-vk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/maulanasdqn/skyla-kernel"

[workspace.dependencies]
anyhow = "1"
ash = "0.38"
half = "2"
libc = "0.2"
memmap2 = "0.9"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
skyla-engine = { path = "skyla-engine" }
skyla-gguf = { path = "skyla-gguf" }
skyla-metal = { path = "skyla-metal" }
skyla-ref = { path = "skyla-ref" }
skyla-shaders = { path = "skyla-shaders" }
skyla-vk = { path = "skyla-vk" }

[profile.release]
debug = 1
