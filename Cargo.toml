[workspace]
resolver = "2"
members = ["skyla-cli", "skyla-engine", "skyla-gguf", "skyla-ref", "skyla-shaders", "skyla-vk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/maulanasdqn/skyla-kernel"

[workspace.dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4.5", features = ["derive"] }
half = "2"
memmap2 = "0.9"
skyla-engine = { path = "skyla-engine" }
skyla-gguf = { path = "skyla-gguf" }
skyla-ref = { path = "skyla-ref" }
skyla-shaders = { path = "skyla-shaders" }
skyla-vk = { path = "skyla-vk" }

[profile.release]
debug = 1
